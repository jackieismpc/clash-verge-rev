[package]
name = "clash-verge-build-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
description = "Native Mac build asset preparation without Node"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
reqwest = { workspace = true }
sha2 = "0.11"
flate2 = "1.1.10"
