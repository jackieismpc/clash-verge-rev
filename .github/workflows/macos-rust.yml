name: Apple Silicon Rust checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0
  CARGO_HOME: ${{ github.workspace }}/.work/cargo
  CARGO_TARGET_DIR: ${{ github.workspace }}/.work/target
  MACOSX_DEPLOYMENT_TARGET: '26.0'
  npm_config_cache: ${{ github.workspace }}/.work/npm-cache
  TMPDIR: ${{ github.workspace }}/.work/tmp

jobs:
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Verify supported host
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          mkdir -p .work/tmp .work/cargo .work/pnpm-store
      - name: Prepare runner Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - run: pnpm install --frozen-lockfile --store-dir .work/pnpm-store
      - run: cargo fmt --all -- --check
      - name: Provision nonexecuted bundle inputs for contract generation
        run: |
          mkdir -p src-tauri/sidecar src-tauri/resources dist
          touch dist/index.html
          for bin in verge-mihomo verge-mihomo-alpha; do
            touch "src-tauri/sidecar/${bin}-aarch64-apple-darwin"
          done
      - run: pnpm gen:contract --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Native arm64 application and integration
        run: |
          scripts/native-core-assets.sh
          scripts/native-core-build.sh build
          scripts/native-ui-build.sh
          scripts/native-ui-test.sh
