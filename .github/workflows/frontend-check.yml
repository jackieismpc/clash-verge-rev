name: Frontend checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0
  npm_config_cache: ${{ github.workspace }}/.work/npm-cache
  TMPDIR: ${{ github.workspace }}/.work/tmp

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p .work/tmp .work/npm-cache .work/pnpm-store
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - run: pnpm install --frozen-lockfile --store-dir .work/pnpm-store
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm knip:check
      - run: node scripts/check-architecture.mjs listen emit invoke
